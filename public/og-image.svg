<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB347;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#skyGradient)"/>
  
  <!-- Mountains/landscape -->
  <path d="M 0 400 Q 300 300 600 350 T 1200 400 L 1200 630 L 0 630 Z" fill="#2D6A4F" opacity="0.8"/>
  <path d="M 0 450 Q 300 350 600 400 T 1200 450 L 1200 630 L 0 630 Z" fill="#1B4332" opacity="0.9"/>
  
  <!-- Trees/vegetation -->
  <circle cx="200" cy="420" r="60" fill="#52B788"/>
  <circle cx="280" cy="400" r="80" fill="#52B788"/>
  <circle cx="350" cy="410" r="70" fill="#2D6A4F"/>
  
  <circle cx="900" cy="430" r="75" fill="#52B788"/>
  <circle cx="1000" cy="410" r="85" fill="#52B788"/>
  <circle cx="1080" cy="420" r="65" fill="#2D6A4F"/>
  
  <!-- ICRA Logo/Text overlay -->
  <text x="600" y="250" font-size="72" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">ICRA</text>
  <text x="600" y="310" font-size="48" fill="white" text-anchor="middle" font-family="Arial, sans-serif">Climate Restoration Across Africa</text>
  
  <!-- Tagline -->
  <text x="600" y="560" font-size="32" fill="white" text-anchor="middle" font-family="Arial, sans-serif" opacity="0.9">Partner with us for lasting impact</text>
</svg>
